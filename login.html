<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SecondStyle Archive</title>
  <meta name="description" content="Sign in to your SecondStyle member account to access order tracking and saved addresses.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Floating Luxury Navigation -->
  <div class="nav-wrapper">
    <header class="floating-nav">
      <a href="index.html" class="nav-brand">
        Second<span>Style</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="homepage.html" class="nav-link">Shop Archive</a></li>
          <li><a href="aboutus.html" class="nav-link">Our Story</a></li>
        </ul>
      </nav>

      <a href="create_account.html" class="btn-secondary" style="font-size: 11px; padding: 6px 14px; min-height: 32px;">
        Register
      </a>
    </header>
  </div>

  <main class="section-spacing" style="padding-top: 48px; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 460px;">
      
      <div class="bezel-card" style="padding: 6px;">
        <div class="bezel-card-inner" style="padding: 36px 32px; text-align: center;">
          
          <span class="pill-tag" style="margin-bottom: 12px;">Member Access</span>
          <h1 style="font-size: 1.8rem; font-weight: 300; margin-bottom: 8px;">Welcome Back</h1>
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 28px;">
            Access your curated bag, order tracking, and private archive circle.
          </p>

          <form onsubmit="handleLoginSubmit(event)" style="text-align: left;">
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address</label>
              <input type="email" id="login-email" required class="form-input" placeholder="bintang@secondstyle.com" value="bintang@secondstyle.com">
            </div>

            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label class="form-label" for="login-password">Password</label>
                <a href="forgot_password.html" style="font-size: 11.5px; color: var(--accent-gold); text-decoration: underline;">Forgot?</a>
              </div>
              <div style="position: relative;">
                <input type="password" id="login-password" required class="form-input" placeholder="••••••••" value="password123" style="padding-right: 44px;">
                <button type="button" onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);" aria-label="Toggle password visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
              <input type="checkbox" id="remember-me" checked style="accent-color: var(--accent-gold); cursor: pointer;">
              <label for="remember-me" style="font-size: 13px; color: var(--text-secondary); cursor: pointer;">Remember this session</label>
            </div>

            <button type="submit" class="btn-luxury" style="width: 100%; justify-content: center; gap: 12px;">
              <span>Sign In to Archive</span>
              <span class="btn-icon">&rarr;</span>
            </button>
          </form>

          <div style="margin-top: 24px; font-size: 13px; color: var(--text-secondary); border-top: 1px solid var(--border-subtle); padding-top: 20px;">
            New to SecondStyle?
            <a href="create_account.html" style="color: var(--text-primary); text-decoration: underline; font-weight: 400; margin-left: 4px;">
              Create Member Profile
            </a>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Editorial Footer -->
  <footer style="background: var(--bg-surface); border-top: 1px solid var(--border-subtle); padding: 36px 0 20px 0;">
    <div class="container" style="text-align: center; font-size: 12px; color: var(--text-muted);">
      &copy; 2026 SecondStyle Archive. Encrypted authentication.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.style.color = 'var(--text-primary)';
      } else {
        input.type = 'password';
        btn.style.color = 'var(--text-muted)';
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      window.SecondStyleStore.updateCurrentUser({ email: email, isLoggedIn: true });
      window.SecondStyleStore.showToast('Welcome Back', 'Access granted to your archive dashboard.');
      setTimeout(() => {
        window.location.href = 'profile.html';
      }, 700);
    }
  </script>
</body>
</html>
